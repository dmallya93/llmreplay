name: Publish

# Manual PyPI publish. Requires repository secret PYPI_TOKEN.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish to upload to PyPI'
        required: true
        default: ''

jobs:
  build-publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
