name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  LLMREPLAY_CI: "1"
  LLMREPLAY_HMAC_KEY: "llmreplay-ci-hmac-key"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Docs gen --check
        run: python -m llmreplay.cli.main docs gen --check --output docs/reference/cli.md
      - name: Pytest (hermetic — no paid APIs; no network required)
        run: pytest -q
      - name: Coverage gate (critical modules >=95%)
        run: bash scripts/mutation_gate.sh
      - name: Release smoke
        run: bash scripts/release_smoke.sh
