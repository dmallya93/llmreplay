[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "coding-agent-vcr"
version = "0.1.0"
description = "VCR / time-travel replay for Claude Code and Codex — deterministic offline agent testing"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Dilip Mallya" }]
keywords = ["llm", "agent", "vcr", "replay", "claude-code", "codex", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Intended Audience :: Developers",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "starlette>=0.37",
  "pyyaml>=6.0",
  "rfc8785>=0.1.4",
  "zstandard>=0.22",
]

[project.urls]
Homepage = "https://github.com/dmallya93/llmreplay"
Repository = "https://github.com/dmallya93/llmreplay"
Issues = "https://github.com/dmallya93/llmreplay/issues"
Documentation = "https://github.com/dmallya93/llmreplay/blob/main/docs/quickstart.md"
"Bug Tracker" = "https://github.com/dmallya93/llmreplay/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "hypothesis>=6.100",
]

[project.scripts]
llmreplay = "llmreplay.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llmreplay"]

[tool.hatch.build.targets.wheel.sources]
"src/llmreplay" = "llmreplay"

[tool.hatch.build.targets.sdist]
include = ["src/llmreplay", "docs", "schemas", "LICENSE", "README.md", "DESIGN.md"]
exclude = ["docs/assets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: fast unit tests",
  "contract: schema/protocol contract tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
